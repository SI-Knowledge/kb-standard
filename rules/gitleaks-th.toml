title = "gitleaks config — Skill Intelligence KB (Thai/EdTech context)"

[extend]
useDefault = true

[[rules]]
id = "th-national-id"
description = "Thai national ID number (13 digits)"
regex = '''\b[0-9]{1}[- ]?[0-9]{4}[- ]?[0-9]{5}[- ]?[0-9]{2}[- ]?[0-9]{1}\b'''
tags = ["pii", "thailand"]

[[rules]]
id = "th-tax-id"
description = "Thai taxpayer ID / PromptPay-style 13-digit number"
regex = '''\b[0-9]{13}\b'''
tags = ["pii", "thailand", "finance"]

[[rules]]
id = "line-channel-token"
description = "LINE Channel access token"
regex = '''[A-Za-z0-9+/=]{100,}'''
path = '''(?i)(line|liff).*\.(json|env|md)$'''
tags = ["line"]

[[rules]]
id = "gcp-service-account"
description = "Google service account JSON"
regex = '''"type"\s*:\s*"service_account"'''
tags = ["gcp"]

[[rules]]
id = "gcp-private-key"
description = "Google/Firebase private_key field"
regex = '''"private_key"\s*:\s*"-----BEGIN'''
tags = ["gcp", "firebase"]

[[rules]]
id = "llm-api-key-anthropic"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
tags = ["llm", "anthropic"]

[[rules]]
id = "llm-api-key-openai"
description = "OpenAI-style API key"
regex = '''sk-(proj-)?[A-Za-z0-9_-]{20,}'''
tags = ["llm", "openai"]

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''AIza[A-Za-z0-9_-]{35}'''
tags = ["llm", "google", "gcp"]

[allowlist]
description = "files that are examples/templates, never real data"
paths = [
  '''templates/.*\.md''',
  '''docs/examples/.*'''
]

# Forbidden path patterns — flagged separately by kb_lint.py, not gitleaks itself,
# because gitleaks only scans content, not "this extension should never exist here".
# See tools/kb_lint.py FORBIDDEN_EXTENSIONS / FORBIDDEN_FILENAMES.
#
# "Sensitive Thai keyword followed by a value" (รหัสผ่าน/เลขบัญชี/เงินเดือน/...)
# is NOT a gitleaks rule here on purpose: gitleaks has no concept of a
# non-blocking rule (every match fails the job), but this pattern is meant to
# be advisory/warning-only per design ("severity = warning, manager decides").
# It's implemented instead as a WARNING in tools/kb_lint.py (SENSITIVE_CONTEXT_WORDS).
