name: kb-ci

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: kb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout kb-standard tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SI-Knowledge/kb-standard
          path: .kb-standard
          ref: main

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install kb-lint dependencies
        run: pip install -q -r .kb-standard/tools/requirements.txt

      - name: Run kb-lint
        run: python .kb-standard/tools/kb_lint.py --repo-root .

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks (diff-aware)
        run: |
          gitleaks detect \
            --config .kb-standard/rules/gitleaks-th.toml \
            --source . \
            --redact \
            --no-banner
