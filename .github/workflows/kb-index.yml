name: kb-index

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: kb-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout kb-standard tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SI-Knowledge/kb-standard
          path: .kb-standard
          ref: main

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r .kb-standard/tools/requirements.txt

      - name: Rebuild index
        run: python .kb-standard/tools/kb_index.py --repo-root .

      - name: Commit index if changed
        run: |
          git config user.name "kb-index-bot"
          git config user.email "kb-index-bot@users.noreply.github.com"
          git add INDEX.md index/index.json index/index.jsonl index/llms.txt
          git diff --cached --quiet || git commit -m "chore(kb-index): rebuild index [skip ci]"
          git push
